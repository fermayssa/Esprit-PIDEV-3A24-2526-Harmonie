# config/services.yaml
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # QrCodeService déclaré manuellement (stable avec Symfony 7.4)
    App\Service\QrCodeService:
        public: true