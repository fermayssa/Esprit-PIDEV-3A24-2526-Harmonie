# config/packages/knp_snappy.yaml
#
# ─── KnpSnappyBundle — wkhtmltopdf uniquement ───────────────────────────────
# On n'active QUE le PDF. La section "image" est volontairement absente car
# WKHTMLTOIMAGE_PATH n'est pas utilisé dans le projet → évite l'erreur :
#   "Environment variables WKHTMLTOIMAGE_PATH are never used"
#
# Le chemin est défini dans .env (ou .env.local) :
#   Linux/macOS  : WKHTMLTOPDF_PATH=/usr/bin/wkhtmltopdf
#   Windows XAMPP: WKHTMLTOPDF_PATH=C:/Program Files/wkhtmltopdf/bin/wkhtmltopdf.exe
# ─────────────────────────────────────────────────────────────────────────────

knp_snappy:
    pdf:
        enabled: true
        binary:  '%env(WKHTMLTOPDF_PATH)%'
        options:
            encoding:    UTF-8
            no-outline:  true
    image:
        enabled: false