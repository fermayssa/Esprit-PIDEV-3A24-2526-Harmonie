knp_paginator:
    page_range: 5                    # nombre de pages affichées dans la pagination
    default_options:
        page_name: page              # nom du paramètre GET pour la page
        sort_field_name: sort        # nom du paramètre GET pour le tri
        sort_direction_name: direction
        distinct: true
        filter_field_name: filterField
        filter_value_name: filterValue
    template:
        pagination: 'knp_paginator/sliding.html.twig'  # template personnalisé