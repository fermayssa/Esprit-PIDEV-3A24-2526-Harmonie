knpu_oauth2_client:
    clients:
        # ── Google ──────────────────────────────────────────────────────────
        google:
            type: google
            client_id: '%env(GOOGLE_CLIENT_ID)%'
            client_secret: '%env(GOOGLE_CLIENT_SECRET)%'
            redirect_route: connect_google_check
            redirect_params: {}
            # Client OAuth Google unique partagé entre :
            # - Login social (/connect/google/check)
            # - Synchronisation Google Calendar (/oauth/google/callback)
            # NOTE: sur cette version de KnpU, les scopes sont passés
            # au moment du redirect() dans le contrôleur OAuth.
            # use_state: true (activé par défaut pour la sécurité CSRF)

        # ── Google Login (séparé du Calendar) ─────────────────────────────
        google_login:
            type: google
            client_id: '%env(GOOGLE_LOGIN_CLIENT_ID)%'
            client_secret: '%env(GOOGLE_LOGIN_CLIENT_SECRET)%'
            redirect_route: connect_google_check
            redirect_params: {}
            # NOTE: sur cette version de KnpU, les scopes sont fournis
            # lors du redirect() dans le contrôleur OAuth.
            # Source des identifiants lus au runtime:
            # - GOOGLE_LOGIN_CLIENT_ID
            # - GOOGLE_LOGIN_CLIENT_SECRET

        # ── Facebook ─────────────────────────────────────────────────────────
        facebook:
            type: facebook
            client_id: '%env(FACEBOOK_CLIENT_ID)%'
            client_secret: '%env(FACEBOOK_CLIENT_SECRET)%'
            redirect_route: connect_facebook_check
            redirect_params: {}
            graph_api_version: 'v20.0'
